<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio & CRM de Empresas - Teléfonos con Nombre y Cargo (1 a 99)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-status { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; }
        .status-pendiente { background-color: #FEF3C7; color: #92400E; }
        .status-espera { background-color: #E0F2FE; color: #075985; }
        .status-negociacion { background-color: #FCE7F3; color: #9D174D; }
        .status-apto { background-color: #D1FAE5; color: #065F46; }
        .status-descartado { background-color: #FEE2E2; color: #991B1B; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-16">
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-building-user text-amber-400 text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Directorio & CRM de Empresas</h1>
                    <p class="text-xs text-slate-400">Energía, Petróleo, Naval & Servicios Industriales (Empresas 1 a 99)</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="openSectorModal()" class="px-3 py-2 bg-sky-600 hover:bg-sky-700 text-white text-sm rounded shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie"></i> Resumen por Sector
                </button>
                <button onclick="exportData()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded border border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Respaldar (JSON)
                </button>
                <button onclick="openModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold text-sm rounded shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Añadir Empresa
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
            <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 text-center">
                <span class="block text-2xl font-bold text-slate-800" id="kpi-total">0</span>
                <span class="text-xs text-slate-500 uppercase font-semibold">Total Registros</span>
            </div>
            <div class="bg-amber-50 p-3 rounded-lg shadow-sm border border-amber-200 text-center">
                <span class="block text-2xl font-bold text-amber-700" id="kpi-pendiente">0</span>
                <span class="text-xs text-amber-700 uppercase font-semibold">Pendientes</span>
            </div>
            <div class="bg-sky-50 p-3 rounded-lg shadow-sm border border-sky-200 text-center">
                <span class="block text-2xl font-bold text-sky-700" id="kpi-negociacion">0</span>
                <span class="text-xs text-sky-700 uppercase font-semibold">En Negociación</span>
            </div>
            <div class="bg-emerald-50 p-3 rounded-lg shadow-sm border border-emerald-200 text-center">
                <span class="block text-2xl font-bold text-emerald-700" id="kpi-apto">0</span>
                <span class="text-xs text-emerald-700 uppercase font-semibold">Evaluado - Apto</span>
            </div>
            <div class="bg-rose-50 p-3 rounded-lg shadow-sm border border-rose-200 text-center">
                <span class="block text-2xl font-bold text-rose-700" id="kpi-descartado">0</span>
                <span class="text-xs text-rose-700 uppercase font-semibold">Descartados</span>
            </div>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-4 flex flex-col md:flex-row gap-3">
            <div class="flex-1 relative">
                <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="renderData()" placeholder="Buscar por empresa, contacto, servicio o palabras clave..." class="w-full pl-9 pr-4 py-2 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div class="w-full md:w-56">
                <select id="filterSector" onchange="renderData()" class="w-full py-2 px-3 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="">Todos los Sectores</option>
                </select>
            </div>
            <div class="w-full md:w-56">
                <select id="filterStatus" onchange="renderData()" class="w-full py-2 px-3 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="">Todos los Estatus</option>
                    <option value="Pendiente Contactar">Pendiente Contactar</option>
                    <option value="Contactado - En espera">Contactado - En espera</option>
                    <option value="En negociación">En negociación</option>
                    <option value="Evaluado - Apto">Evaluado - Apto</option>
                    <option value="Descartado">Descartado</option>
                </select>
            </div>
            <div class="w-full md:w-48">
                <select id="filterRating" onchange="renderData()" class="w-full py-2 px-3 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="">Todas las Calificaciones</option>
                    <option value="5">5 ⭐ (Excelente)</option>
                    <option value="4">4 ⭐ (Bueno)</option>
                    <option value="3">3 ⭐ (Regular)</option>
                    <option value="2">2 ⭐ (Insuficiente)</option>
                    <option value="1">1 ⭐ (No recomendado)</option>
                </select>
            </div>
        </div>

        <div class="bg-slate-800 text-white p-3 rounded-lg shadow-sm mb-6 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-semibold">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 text-amber-500 rounded focus:ring-amber-400">
                    <span>Seleccionar todas las visibles</span>
                </label>
                <span class="text-xs text-slate-400 border-l border-slate-600 pl-3" id="selectedCount">0 seleccionadas</span>
            </div>
            <div>
                <button onclick="deleteSelected()" id="btnDeleteSelected" disabled class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white text-xs font-bold rounded transition flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Eliminar seleccionadas
                </button>
            </div>
        </div>

        <div id="companyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>

    <!-- Modal Resumen por Sector -->
    <div id="sectorModal" class="fixed inset-0 bg-black/60 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl my-8 overflow-hidden">
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-chart-pie text-sky-400"></i> Resumen de Empresas por Sector</h3>
                <button onclick="closeSectorModal()" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto">
                <div id="sectorSummaryContent" class="space-y-3">
                    <!-- Dinámico -->
                </div>
            </div>
            <div class="bg-slate-50 px-6 py-3 border-t flex justify-end">
                <button onclick="closeSectorModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded text-sm">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Añadir/Editar Empresa -->
    <div id="modal" class="fixed inset-0 bg-black/60 hidden backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl my-8 overflow-hidden">
            <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-bold" id="modalTitle">Añadir Nueva Empresa</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-times"></i></button>
            </div>

            <form id="companyForm" onsubmit="saveCompany(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="empresaId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre de la Empresa *</label>
                        <input type="text" id="nombre" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Sector / Categoría</label>
                        <input type="text" id="sector" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Producto / Servicio Específico</label>
                    <textarea id="producto" rows="2" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ubicación / País / Puerto</label>
                    <input type="text" id="ubicacion" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                </div>

                <!-- Sección Múltiples Teléfonos con Nombre y Cargo -->
                <div class="bg-emerald-50/50 p-4 rounded-lg border border-emerald-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-emerald-900 uppercase">Teléfonos con Nombre y Cargo</label>
                        <button type="button" onclick="addPhoneField()" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Añadir Teléfono
                        </button>
                    </div>
                    <div id="phonesContainer" class="space-y-3">
                        <!-- Dinámico -->
                    </div>
                </div>

                <!-- Sección Múltiples Correos -->
                <div class="bg-sky-50/50 p-4 rounded-lg border border-sky-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-sky-900 uppercase">Correos Electrónicos</label>
                        <button type="button" onclick="addEmailField()" class="px-2 py-1 bg-sky-600 hover:bg-sky-700 text-white rounded text-xs font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Añadir Correo
                        </button>
                    </div>
                    <div id="emailsContainer" class="space-y-2">
                        <!-- Dinámico -->
                    </div>
                </div>

                <!-- Sección Múltiples Páginas Web -->
                <div class="bg-amber-50/50 p-4 rounded-lg border border-amber-100">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-amber-900 uppercase">Páginas Web</label>
                        <button type="button" onclick="addWebField()" class="px-2 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Añadir Web
                        </button>
                    </div>
                    <div id="websContainer" class="space-y-2">
                        <!-- Dinámico -->
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Servicio / Tipo Requerido</label>
                        <input type="text" id="servicio_interes" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Estatus de Evaluación</label>
                        <select id="estatus" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                            <option value="Pendiente Contactar">Pendiente Contactar</option>
                            <option value="Contactado - En espera">Contactado - En espera</option>
                            <option value="En negociación">En negociación</option>
                            <option value="Evaluado - Apto">Evaluado - Apto</option>
                            <option value="Descartado">Descartado</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Fecha de Contacto</label>
                        <input type="text" id="fecha_contacto" placeholder="DD/MM/AAAA" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Valoración / Calificación</label>
                        <select id="valoracion" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                            <option value="">Sin calificar</option>
                            <option value="5">5 - Excelente</option>
                            <option value="4">4 - Bueno</option>
                            <option value="3">3 - Regular</option>
                            <option value="2">2 - Insuficiente</option>
                            <option value="1">1 - No recomendado</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Siguiente Acción Requerida</label>
                    <input type="text" id="siguiente_accion" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Notas y Observaciones</label>
                    <textarea id="notas" rows="3" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Añadir Archivos Adjuntos (PDF, JPG, PNG)</label>
                    <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border text-slate-600 rounded text-sm hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded text-sm shadow">Guardar Empresa</button>
                </div>
            </form>
        </div>
    </div>

        function updateSectorDropdown() {
            const sectorSelect = document.getElementById('filterSector');
            const currentVal = sectorSelect.value;
            
            const sectorsSet = new Set();
            companies.forEach(c => {
                if (c.sector) sectorsSet.add(c.sector);
            });
            const sortedSectors = Array.from(sectorsSet).sort();

            let options = '<option value="">Todos los Sectores</option>';
            sortedSectors.forEach(s => {
                options += `<option value="${s}">${s}</option>`;
            });
            sectorSelect.innerHTML = options;
            sectorSelect.value = currentVal;
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'Pendiente Contactar': return '<span class="badge-status status-pendiente">Pendiente Contactar</span>';
                case 'Contactado - En espera': return '<span class="badge-status status-espera">Contactado - En espera</span>';
                case 'En negociación': return '<span class="badge-status status-negociacion">En negociación</span>';
                case 'Evaluado - Apto': return '<span class="badge-status status-apto">Evaluado - Apto</span>';
                case 'Descartado': return '<span class="badge-status status-descartado">Descartado</span>';
                default: return '<span class="badge-status bg-slate-200 text-slate-700">Sin Estado</span>';
            }
        }

        function getStars(rating) {
            if (!rating) return '<span class="text-xs text-slate-400">Sin calificar</span>';
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += i <= rating ? '<i class="fa-solid fa-star text-amber-400 text-xs"></i>' : '<i class="fa-regular fa-star text-slate-300 text-xs"></i>';
            }
            return `<div class="flex items-center gap-1">${stars} <span class="text-xs font-semibold text-slate-600">(${rating}/5)</span></div>`;
        }

                const matchSearch = (c.nombre || '').toLowerCase().includes(search) ||
                                    (c.producto || '').toLowerCase().includes(search) ||
                                    (c.sector || '').toLowerCase().includes(search) ||
                                    (c.contacto || '').toLowerCase().includes(search) ||
                                    (c.telefonos && c.telefonos.some(t => (t.nombre || '').toLowerCase().includes(search) || (t.telefono || '').includes(search)));
                const matchSector = filterSector === '' || c.sector === filterSector;
                const matchStatus = filterStatus === '' || c.estatus === filterStatus;
                const matchRating = filterRating === '' || String(c.valoracion) === String(filterRating);
                return matchSearch && matchSector && matchStatus && matchRating;
            });
        }

        function renderData() {
            const grid = document.getElementById('companyGrid');
            const filtered = getFilteredCompanies();

            document.getElementById('kpi-total').innerText = companies.length;
            document.getElementById('kpi-pendiente').innerText = companies.filter(c => c.estatus === 'Pendiente Contactar').length;
            document.getElementById('kpi-negociacion').innerText = companies.filter(c => c.estatus === 'En negociación').length;
            document.getElementById('kpi-apto').innerText = companies.filter(c => c.estatus === 'Evaluado - Apto').length;
            document.getElementById('kpi-descartado').innerText = companies.filter(c => c.estatus === 'Descartado').length;

            updateSelectedBar();

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-lg border">
                    <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
                    <p>No se encontraron empresas con los criterios seleccionados.</p>
                </div>`;
                return;
            }

            grid.innerHTML = filtered.map(c => {
                const isSelected = selectedIds.has(c.id);
                
                // Render multiple phones with name and cargo
                const telefonosList = (c.telefonos && c.telefonos.length > 0) ? c.telefonos.map(item => `
                    <div class="bg-emerald-50/60 p-2 rounded border border-emerald-100 space-y-1">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-phone text-emerald-600 w-4"></i>
                            <a href="tel:${item.telefono}" class="font-bold text-emerald-800 hover:underline">${item.telefono || 'Sin número'}</a>
                        </div>
                        ${(item.nombre || item.cargo) ? `
                            <div class="text-[11px] text-slate-600 pl-6 flex items-center gap-1.5 flex-wrap">
                                <i class="fa-solid fa-user text-slate-400"></i>
                                <span class="font-semibold text-slate-800">${item.nombre || 'Sin nombre'}</span>
                                ${item.cargo ? `<span class="text-slate-400">(${item.cargo})</span>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `).join('') : '';

                // Render multiple emails
                const correosList = (c.correos && c.correos.length > 0) ? c.correos.map(email => `
                    <div class="flex items-center gap-2 truncate">
                        <i class="fa-solid fa-envelope text-sky-500 w-4"></i>
                        <a href="mailto:${email}" class="text-sky-600 hover:underline truncate">${email}</a>
                    </div>
                `).join('') : '';

                // Render multiple webs
                const websList = (c.webs && c.webs.length > 0) ? c.webs.map(web => `
                    <div class="flex items-center gap-2 truncate">
                        <i class="fa-solid fa-globe text-amber-500 w-4"></i>
                        <a href="${web.startsWith('http') ? web : 'http://' + web}" target="_blank" class="text-amber-600 hover:underline truncate">${web}</a>
                    </div>
                `).join('') : '';

                return `
                <div class="bg-white rounded-xl shadow-sm border ${isSelected ? 'border-amber-500 ring-2 ring-amber-400' : 'border-slate-200'} hover:shadow-md transition flex flex-col justify-between overflow-hidden relative">
                    <div class="p-5">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" onchange="toggleSelect(${c.id}, this.checked)" ${isSelected ? 'checked' : ''} class="w-4 h-4 text-amber-600 rounded focus:ring-amber-500 cursor-pointer">
                                <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">${c.sector || 'General'}</span>
                            </div>
                            ${getStatusBadge(c.estatus)}
                        </div>
                        <h3 class="font-bold text-lg text-slate-900 leading-snug">${c.id}. ${c.nombre}</h3>
                        ${getStars(c.valoracion)}
                        
                        <p class="text-xs text-slate-600 mt-3 line-clamp-3 bg-slate-50 p-2 rounded border border-slate-100">
                            <strong>Servicios/Productos:</strong> ${c.producto || 'No especificado'}
                        </p>

                        <div class="mt-4 space-y-2 text-xs text-slate-600">
                            ${telefonosList}
                            ${correosList}
                            ${websList}
                            ${c.ubicacion ? `
                                <div class="flex items-center gap-2 pt-1">
                                    <i class="fa-solid fa-location-dot text-rose-400 w-4"></i>
                                    <span>${c.ubicacion}</span>
                                </div>
                            ` : ''}
                        </div>

                        ${c.siguiente_accion ? `
                            <div class="mt-3 text-xs bg-amber-50 p-2 rounded border border-amber-200 text-amber-800">
                                <i class="fa-solid fa-clock text-amber-600 mr-1"></i> <strong>Sig. Acción:</strong> ${c.siguiente_accion}
                            </div>
                        ` : ''}

                        ${c.attachments && c.attachments.length > 0 ? `
                            <div class="mt-3 pt-3 border-t">
                                <span class="text-[11px] font-bold text-slate-500 uppercase block mb-1">Archivos Adjuntos (${c.attachments.length}):</span>
                                <div class="flex flex-wrap gap-1">
                                    ${c.attachments.map(att => `
                                        <a href="${att.data}" download="${att.name}" class="inline-flex items-center gap-1 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border">
                                            <i class="${att.type.includes('pdf') ? 'fa-solid fa-file-pdf text-rose-500' : 'fa-solid fa-file-image text-emerald-500'}"></i>
                                            <span class="max-w-[120px] truncate">${att.name}</span>
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="bg-slate-50 px-5 py-3 border-t flex justify-end gap-2">
                        <button onclick="editCompany(${c.id})" class="px-3 py-1 bg-white hover:bg-slate-100 border text-slate-700 rounded text-xs font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-pen text-amber-500"></i> Editar
                        </button>
                        <button onclick="deleteCompany(${c.id})" class="px-2 py-1 bg-white hover:bg-rose-50 border border-slate-200 text-rose-600 rounded text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // Dynamic phone, email and web input handlers in modal
        function addPhoneField(telefono = '', nombre = '', cargo = '') {
            const container = document.getElementById('phonesContainer');
            const div = document.createElement('div');
            div.className = 'bg-white p-3 rounded border border-emerald-200 space-y-2 relative shadow-sm';
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <div class="flex-1">
                        <label class="block text-[10px] font-bold text-emerald-800 uppercase mb-0.5">Teléfono / WhatsApp</label>
                        <input type="text" placeholder="+58 414-0000000" value="${telefono}" class="phone-num-input w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <button type="button" onclick="this.closest('div.bg-white').remove()" class="mt-4 px-2.5 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">Nombre de Contacto</label>
                        <input type="text" placeholder="Ej. Juan Pérez" value="${nombre}" class="phone-name-input w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">Cargo / Función</label>
                        <input type="text" placeholder="Ej. Gerente de Ventas" value="${cargo}" class="phone-cargo-input w-full p-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function addEmailField(value = '') {
            const container = document.getElementById('emailsContainer');
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2';
            div.innerHTML = `
                <input type="email" placeholder="correo@empresa.com" value="${value}" class="email-input flex-1 p-2 border rounded text-sm focus:ring-2 focus:ring-sky-500">
                <button type="button" onclick="this.parentElement.remove()" class="px-2.5 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function addWebField(value = '') {
            const container = document.getElementById('websContainer');
            const div = document.createElement('div');
            div.className = 'flex items-center gap-2';
            div.innerHTML = `
                <input type="text" placeholder="www.empresa.com" value="${value}" class="web-input flex-1 p-2 border rounded text-sm focus:ring-2 focus:ring-amber-500">
                <button type="button" onclick="this.parentElement.remove()" class="px-2.5 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function openSectorModal() {
            const counts = {};
            companies.forEach(c => {
                const s = c.sector || 'General / Sin Sector';
                counts[s] = (counts[s] || 0) + 1;
            });

            const sortedSectors = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const total = companies.length;

            const content = sortedSectors.map(([sector, count]) => {
                const pct = ((count / total) * 100).toFixed(1);
                return `
                    <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-col gap-2 hover:bg-sky-50/50 transition cursor-pointer" onclick="filterBySector('${sector.replace(/'/g, "\'")}')">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-slate-800">${sector}</span>
                            <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-xs font-semibold">${count} empresa${count > 1 ? 's' : ''} (${pct}%)</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div class="bg-sky-600 h-2 rounded-full" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('sectorSummaryContent').innerHTML = `
                <p class="text-xs text-slate-500 mb-2">Haz clic en cualquier sector para filtrar automáticamente las empresas en el directorio principal.</p>
                <div class="space-y-2">${content}</div>
            `;
            document.getElementById('sectorModal').classList.remove('hidden');
        }

        function closeSectorModal() {
            document.getElementById('sectorModal').classList.add('hidden');
        }

        function filterBySector(sector) {
            document.getElementById('filterSector').value = sector;
            closeSectorModal();
            renderData();
        }

        function toggleSelect(id, isChecked) {
            if (isChecked) {
                selectedIds.add(id);
            } else {
                selectedIds.delete(id);
            }
            renderData();
        }

        function toggleSelectAll(isChecked) {
            const visibleCompanies = getFilteredCompanies();
            visibleCompanies.forEach(c => {
                if (isChecked) {
                    selectedIds.add(c.id);
                } else {
                    selectedIds.delete(c.id);
                }
            });
            renderData();
        }

        function updateSelectedBar() {
            const count = selectedIds.size;
            document.getElementById('selectedCount').innerText = `${count} seleccionadas`;
            const btnDelete = document.getElementById('btnDeleteSelected');
            btnDelete.disabled = count === 0;

            const visibleCompanies = getFilteredCompanies();
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (visibleCompanies.length > 0 && visibleCompanies.every(c => selectedIds.has(c.id))) {
                selectAllCheckbox.checked = true;
            } else {
                selectAllCheckbox.checked = false;
            }
        }

        function deleteSelected() {
            const count = selectedIds.size;
            if (count === 0) return;

            if (confirm(`¿Está seguro de eliminar las ${count} empresas seleccionadas?`)) {
                companies = companies.filter(c => !selectedIds.has(c.id));
                selectedIds.clear();
                saveToStorage();
            }
        }

        function deleteCompany(id) {
            if (confirm('¿Está seguro de eliminar este registro de empresa?')) {
                companies = companies.filter(c => c.id !== id);
                selectedIds.delete(id);
                saveToStorage();
            }
        }

        function openModal(isEdit = false) {
            document.getElementById('modalTitle').innerText = isEdit ? 'Editar Empresa' : 'Añadir Nueva Empresa';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('companyForm').reset();
            document.getElementById('empresaId').value = '';
            document.getElementById('phonesContainer').innerHTML = '';
            document.getElementById('emailsContainer').innerHTML = '';
            document.getElementById('websContainer').innerHTML = '';
            document.getElementById('modal').classList.add('hidden');
        }

        async function saveCompany(e) {
            e.preventDefault();
            const id = document.getElementById('empresaId').value;
            const fileInput = document.getElementById('fileInput');
            const files = Array.from(fileInput.files);
            let attachments = [];

            for (let file of files) {
                const base64 = await readFileAsBase64(file);
                attachments.push({
                    name: file.name,
                    type: file.type,
                    data: base64
                });
            }

            const existingCompany = companies.find(c => String(c.id) === String(id));
            if (existingCompany && existingCompany.attachments) {
                attachments = [...existingCompany.attachments, ...attachments];
            }

            // Gather multiple phones with name and cargo
            const phoneDivs = document.querySelectorAll('#phonesContainer > div');
            const telefonos = [];
            phoneDivs.forEach(div => {
                const tel = div.querySelector('.phone-num-input').value.trim();
                const nom = div.querySelector('.phone-name-input').value.trim();
                const car = div.querySelector('.phone-cargo-input').value.trim();
                if (tel || nom || car) {
                    telefonos.push({
                        telefono: tel,
                        nombre: nom,
                        cargo: car
                    });
                }
            });

            // Gather multiple emails
            const correos = Array.from(document.querySelectorAll('.email-input'))
                                .map(input => input.value.trim())
                                .filter(v => v !== '');

            // Gather multiple webs
            const webs = Array.from(document.querySelectorAll('.web-input'))
                            .map(input => input.value.trim())
                            .filter(v => v !== '');

            const companyData = {
                id: id ? parseInt(id) : Date.now(),
                nombre: document.getElementById('nombre').value,
                sector: document.getElementById('sector').value,
                producto: document.getElementById('producto').value,
                telefonos: telefonos,
                correos: correos,
                webs: webs,
                servicio_interes: document.getElementById('servicio_interes').value,
                ubicacion: document.getElementById('ubicacion').value,
                estatus: document.getElementById('estatus').value,
                fecha_contacto: document.getElementById('fecha_contacto').value,
                valoracion: document.getElementById('valoracion').value,
                siguiente_accion: document.getElementById('siguiente_accion').value,
                notas: document.getElementById('notas').value,
                attachments: attachments
            };

            if (id) {
                const index = companies.findIndex(c => String(c.id) === String(id));
                companies[index] = companyData;
            } else {
                companies.unshift(companyData);
            }

            saveToStorage();
            closeModal();
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function editCompany(id) {
            const c = companies.find(item => item.id === id);
            if (!c) return;

            document.getElementById('empresaId').value = c.id;
            document.getElementById('nombre').value = c.nombre || '';
            document.getElementById('sector').value = c.sector || '';
            document.getElementById('producto').value = c.producto || '';
            document.getElementById('servicio_interes').value = c.servicio_interes || '';
            document.getElementById('ubicacion').value = c.ubicacion || '';
            document.getElementById('estatus').value = c.estatus || 'Pendiente Contactar';
            document.getElementById('fecha_contacto').value = c.fecha_contacto || '';
            document.getElementById('valoracion').value = c.valoracion || '';
            document.getElementById('siguiente_accion').value = c.siguiente_accion || '';
            document.getElementById('notas').value = c.notas || '';

            // Populate multiple phones with name and cargo
            const phonesContainer = document.getElementById('phonesContainer');
            phonesContainer.innerHTML = '';
            if (c.telefonos && c.telefonos.length > 0) {
                c.telefonos.forEach(item => {
                    addPhoneField(item.telefono || '', item.nombre || '', item.cargo || '');
                });
            } else {
                // If legacy c.telefono or c.contacto existed
                addPhoneField('', '', '');
            }

            // Populate multiple emails
            const emailsContainer = document.getElementById('emailsContainer');
            emailsContainer.innerHTML = '';
            if (c.correos && c.correos.length > 0) {
                c.correos.forEach(email => addEmailField(email));
            } else {
                addEmailField('');
            }

            // Populate multiple webs
            const websContainer = document.getElementById('websContainer');
            websContainer.innerHTML = '';
            if (c.webs && c.webs.length > 0) {
                c.webs.forEach(web => addWebField(web));
            } else {
                addWebField('');
            }

            openModal(true);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(companies, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "directorio_1_99_telefonos_con_nombre_cargo.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        updateSectorDropdown();
        renderData();
    </script>
</body>
</html>
